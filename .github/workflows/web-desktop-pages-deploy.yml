name: Web/Desktop — Cloudflare Pages

# Deploys the static Next.js export (`npm run build:static`) to
# Cloudflare Pages via wrangler. Triggered on push to `main` after the
# Web/Desktop CI check passes; preview deploys are produced for every
# pull request.

on:
  push:
    branches: [main]
    paths:
      - "web-desktop/**"
      - ".github/workflows/web-desktop-pages-deploy.yml"
      - ".github/workflows/web-desktop-ci.yml"
  pull_request:
    paths:
      - "web-desktop/**"
      - ".github/workflows/web-desktop-pages-deploy.yml"
  workflow_dispatch:

concurrency:
  # Cancel superseded deploys for the same ref — keeps the Pages preview
  # queue clear when a PR is force-pushed.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web-desktop

jobs:
  # Mirror of the existing Web/Desktop CI matrix. Re-run on the deploy
  # runner so the deploy can fail independently of the CI workflow (and
  # so we are not coupled to a separate workflow that could be disabled).
  # Cheap (~1 min) — typecheck/lint/test + both build modes.
  check:
    name: CI matrix
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:static

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # APP_TARGET=desktop + NEXT_PUBLIC_STATIC_EXPORT=1 produces the
        # static HTML the dashboard reads. Output lands in `out/` and is
        # uploaded to Pages via wrangler.
        run: npm run build:static

      - name: Deploy (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          # `pages deploy` consumes the static directory directly. The
          # GitHub repo secret `CLOUDFLARE_API_TOKEN` must have
          # `Cloudflare Pages: Edit` permission for this project, and
          # `CLOUDFLARE_ACCOUNT_ID` is the numeric ID shown on the
          # dashboard right sidebar. `CLOUDFLARE_PAGES_PROJECT` is a
          # repository variable (not a secret) so the project slug is
          # visible in PRs that touch this workflow.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --commit-dirty=true

      - name: Deploy (preview)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch` puts the preview on a Pages preview URL exposed
          # back on the PR via Cloudflare's bot comment.
          command: >-
            pages deploy out
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.head_ref }}