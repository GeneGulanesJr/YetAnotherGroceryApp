name: Web/Desktop CI

on:
  push:
    branches: [main]
    paths: ["web-desktop/**", ".github/workflows/web-desktop-ci.yml"]
  pull_request:
    paths: ["web-desktop/**", ".github/workflows/web-desktop-ci.yml"]

defaults:
  run:
    working-directory: web-desktop

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Both targets must build (spec: desktop breaks if code relies on a
      # runtime Next.js server, so the static export is validated in CI).
      - run: npm run build
      - run: npm run build:desktop
